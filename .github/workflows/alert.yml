name: signal-alert

on:
  schedule:
    # 每 2 小时一次（UTC 偶数点 05 分）= 北京 08:05 / 10:05 / 12:05 ...
    - cron: "5 */2 * * *"
  workflow_dispatch:

concurrency:
  group: signal-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check main signals and push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python check_push.py

      - name: Scan altcoins
        run: python scan_alts.py || true

      - name: Scan funding rates
        run: python funding_scan.py || true

      - name: Show alt result
        run: python -c "import json;d=json.load(open('alt_watch.json',encoding='utf-8'));print('scanned',d['scanned']);print('short',[(x['sym'],x.get('on_bn')) for x in d.get('short',[])])" || true

      - name: Show funding result
        run: python -c "import json;d=json.load(open('funding.json',encoding='utf-8'));print('updated',d['updated']);print('top',[(x['s'],x['ann']) for x in d['top'][:8]])" || true

      - name: Commit state and alt data
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add alert_state.json alt_watch.json binance_futures.json funding.json || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update alt data"
            git push
          fi

      # GITHUB_TOKEN 推的提交不会触发其他工作流，必须手动踢一下 Pages
      - name: Trigger pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo ${{ github.repository }} || true
