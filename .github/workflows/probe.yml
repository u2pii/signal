name: probe

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: symbol
        required: true
        default: LYNUSDT

jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe
        run: python probe.py ${{ github.event.inputs.symbol }}
