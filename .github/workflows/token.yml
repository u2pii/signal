name: daily-token

on:
  schedule:
    # 北京 00:01 生成当天口令（UTC 16:01 前一天）
    - cron: "1 16 * * *"
  workflow_dispatch:

concurrency:
  group: daily-token
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today token
        env:
          MASTER_PW: ${{ secrets.MASTER_PW }}
        run: python gen_token.py

      - name: Commit token hash
        run: |
          git config user.name "token-bot"
          git config user.email "token-bot@users.noreply.github.com"
          git add token.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: rotate token"
            git push
          fi
