<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0 auto;background:#0a0c10;color:#d2d8e6;font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;

h1{font-size:20px;margin:0 0 4px;color:#fff;font-weight:700}
.s{font-size:12.5px;color:#5f6779;margin-bottom:20px}
.btn{width:100%;padding:22px;border:0;border-radius:18px;font-size:19px;font-weight:700;color:#fff;

.pill.x{margin-left:auto;background:#19c07a;color:#04140d;font-size:11.5px}
.pill.ok{background:#2a3448;color:#8b93a6;font-size:11.5px;margin-left:auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;font-size:14px}

.lev{color:#8ab4ff!important}

.bad{color:#ff6b7d!important}

<script>
/* ============ 配置 ============ */
const CFG = {
  N: 20,            // 突破周期
  K_SL: 1.5,        // 初始止损 ATR 倍数
  M_TRAIL: 3.0,     // 移动止损 ATR 倍数（吊灯）
  RISK: 0.08,       // 单笔风险（8% 对应「能接受50%回撤」）
  MAX_POS: 2,       // 最多同时持仓
  MAX_LEV: 10,      // 杠杆上限
  CAPITAL: 97.66,   // 本金 USDT
  COINS: ["SOL","DOGE","BNB","ADA","BTC","ETH"]
};

/* 风险档位（点一下就切） */
const RISK_LEVELS = [
  { key: 0.03, name: "保守", hint: "亏50%概率 3%" },
  { key: 0.05, name: "标准", hint: "亏50%概率 19%" },
  { key: 0.08, name: "积极", hint: "亏50%概率 64%" },
  { key: 0.15, name: "激进", hint: "亏50%概率 99%" },
];

/* ============ 工具 ============ */
const $ = (id) => document.getElementById(id);
const f = (p) => p >= 1000 ? p.toFixed(1) : p >= 10 ? p.toFixed(2) : p >= 1 ? p.toFixed(3) : p.toFixed(5);

function jfetch(url, ms = 15000) {
  return new Promise((res, rej) => {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms);
    fetch(url, { signal: ctl.signal })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(d => { clearTimeout(t); res(d); })
      .catch(e => { clearTimeout(t); rej(e); });
  });
}

/* 抓日线：币安优先（和你看到的价格一致），失败再退 Gate / OKX */
async function daily(sym) {
  // 1) 币安公开行情（data-api.binance.vision，国内可通）
  try {
    const raw = await jfetch("https://data-api.binance.vision/api/v3/klines?symbol=" +
      sym + "USDT&interval=1d&limit=200");
    if (Array.isArray(raw) && raw.length >= 45) {
      const b = raw.map(k => ({ t: +k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4] }));
      b.sort((a, x) => a.t - x.t);
      b._src = "币安";
      return b;
    }
  } catch (e) { /* 下一步 */ }

  // 2) Gate 合约
  try {
    const raw = await jfetch("https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=" +
      sym + "_USDT&interval=1d&limit=200");
    const b = raw.map(r => ({ t: +r.t, o: +r.o, h: +r.h, l: +r.l, c: +r.c }));
    b.sort((a, x) => a.t - x.t);
    if (b.length >= 45) { b._src = "Gate合约"; return b; }
  } catch (e) { /* 下一步 */ }

  // 3) OKX 永续
  try {
    const raw = await jfetch("https://www.okx.com/api/v5/market/candles?instId=" + sym + "-USDT-SWAP&bar=1D&limit=200");
    if (raw.code === "0" && raw.data && raw.data.length >= 45) {
      const b = raw.data.map(r => ({ t: +r[0], o: +r[1], h: +r[2], l: +r[3], c: +r[4] }));
      b.sort((a, x) => a.t - x.t);
      b._src = "OKX";
      return b;
    }
  } catch (e) { /* 下一步 */ }

  // 4) 兜底：Gate 现货
  const raw = await jfetch("https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=" +
    sym + "_USDT&interval=1d&limit=200");
  const b = raw.map(r => ({ t: +r[0], o: +r[5], h: +r[3], l: +r[4], c: +r[2] }));
  b.sort((a, x) => a.t - x.t);
  b._src = "Gate现货";
  return b;
}

function atr14(bars, n = 14) {
  let a = null; const tr = [];
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const v = i === 0 ? b.h - b.l
      : Math.max(b.h - b.l, Math.abs(b.h - bars[i-1].c), Math.abs(b.l - bars[i-1].c));
    tr.push(v);
    if (i === n - 1) a = tr.slice(0, n).reduce((x, y) => x + y, 0) / n;
    else if (i >= n) a = (a * (n - 1) + v) / n;
  }
  return a;
}

/* ============ 本地记录 ============ */
const K = (s) => "pos_" + s;
const load = (s) => { try { const v = localStorage.getItem(K(s)); return v ? JSON.parse(v) : null } catch(e) { return null } };
const loadPos = load;
const save = (s, o) => { try { localStorage.setItem(K(s), JSON.stringify(o)) } catch(e) {} };
const savePos = save;
const del = (s) => { try { localStorage.removeItem(K(s)) } catch(e) {} };

/* 更新移动止损（吊灯）：持仓期极值 ∓ 3×ATR，只朝有利方向 */
function updateTrailing(p, r) {
  // 山寨币做空：按策略不设止损、持有 20 天，只显示盈亏
  if (p.alt) {
    const pnl = (r.cur / p.entry - 1) * 100 * (p.dir === "L" ? 1 : -1);
    return { sl: p.sl, ext: p.ext || p.entry, moved: false, pnlPct: pnl,
             shouldClose: false, closeReason: null, atr: r.atr };
  }
  const atr = r.atr;
  const close = r.cur;
  let sl = p.sl, ext = p.ext;
  if (p.dir === "L") {
    ext = Math.max(ext || p.entry, close);
    sl = Math.max(sl, ext - CFG.M_TRAIL * atr);
  } else {
    ext = Math.min(ext || p.entry, close);
    sl = Math.min(sl, ext + CFG.M_TRAIL * atr);
  }
  const moved = (p.dir === "L" ? sl > p.sl + 1e-9 : sl < p.sl - 1e-9);
  const pnlPct = (close / p.entry - 1) * 100 * (p.dir === "L" ? 1 : -1);

  // 是否该平仓
  const hit = (p.dir === "L" && r.cur <= sl) || (p.dir === "S" && r.cur >= sl);
  const rev = (p.dir === "L" && close < r.ll) || (p.dir === "S" && close > r.hh);

  return {
    sl, ext, moved, pnlPct,
    shouldClose: hit || rev,
    closeReason: hit ? "触及移动止损" : (rev ? "反向信号" : null),
    atr,
  };
}

/* 更新持仓的止损（用户点「已更新」后写入） */
function applySl(sym) {
  const p = loadPos(sym);
  if (!p || !p._newSl) return;
  p.sl = p._newSl;
  p.ext = p._newExt;
  delete p._newSl; delete p._newExt;
  savePos(sym, p);
  if (window._last) render(window._last.rows, window._last.sigs);
}

function closePos(sym) {
  const p = loadPos(sym);
  if (!p) return;
  const r = (window._last && window._last.rows || []).find(x => x.sym === sym);
  let info = "";
  if (r) {
    const pnlPct = (r.cur / p.entry - 1) * 100 * (p.dir === "L" ? 1 : -1);
    const pnlUsd = p.qty * r.cur * (pnlPct / 100);
    info = "\n\n当前盈亏：" + (pnlPct >= 0 ? "+" : "") + pnlPct.toFixed(2) + "%" +
           "（" + (pnlUsd >= 0 ? "+" : "") + pnlUsd.toFixed(2) + "U）";
  }
  if (!confirm("确认平掉 / 删除 " + sym + " 这条记录？" + info +
               "\n\n（只删 App 里的记录，不影响你在币安的实际持仓）")) return;
  // 把已实现盈亏结算进基准余额
  if (r) {
    const sign2 = p.dir === "L" ? 1 : -1;
    const mg2 = p.margin || (p.qty * p.entry / (p.lev || 1));
    let realized = p.qty * (r.cur - p.entry) * sign2;
    if ((p.marginMode || "isolated") !== "cross" && mg2 > 0 && realized < -mg2) realized = -mg2;
    BASE_CAP = Math.max(BASE_CAP + realized, 0.01);
    try { localStorage.setItem("capital", String(BASE_CAP)); } catch (e) {}
    addSettlement({ sym: sym, dir: p.dir === "L" ? "多" : "空",
                    pnl: realized, date: new Date().toISOString().slice(0, 10) });
    alert("已结算：" + (realized >= 0 ? "+" : "") + realized.toFixed(2) + "U\n基准余额 → " + BASE_CAP.toFixed(2) + "U");
  }
  del(sym);
  if (window._last) render(window._last.rows, window._last.sigs);
  refreshCapBar();
}

function resetAll() {
  if (!confirm("清空所有开仓记录？（只清记录，不影响你的实际持仓）")) return;
  Object.keys(localStorage).filter(k => k.indexOf("pos_") === 0).forEach(k => localStorage.removeItem(k));
  location.reload();
}

/* ============ 主流程 ============ */
async function scanAll() {
  const btn = $("go");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>抓数据中…';
  $("out").innerHTML = "";
  $("hint").textContent = "正在拉取 6 个币的日线数据…";

  // 已记录持仓的币也要扫描（可能在列表之外，比如山寨币）
  let heldSyms = [];
  try {
    heldSyms = Object.keys(localStorage).filter(k => k.indexOf("pos_") === 0).map(k => k.slice(4));
  } catch (e) {}
  const scanList = CFG.COINS.concat(heldSyms.filter(s => CFG.COINS.indexOf(s) < 0));

  const rows = await Promise.all(scanList.map(async (sym) => {
    try {
      const bars = await daily(sym);
      const closed = bars.slice(0, -1);
      const cur = bars[bars.length - 1].c;
      const n = CFG.N;
      const seg = closed.slice(-n - 1, -1);   // 关键：排除当前根
      const hh = Math.max.apply(null, seg.map(b => b.h));
      const ll = Math.min.apply(null, seg.map(b => b.l));
      const atr = atr14(closed);
      // 只有主流币走 Donchian 主系统；山寨币只做持仓跟踪，不出信号
      // （否则会跟「暴涨→做空」的山寨策略打架）
      const isMajor = CFG.COINS.indexOf(sym) >= 0;
      return { sym, cur, hh, ll, atr, src: bars._src, isMajor,
               sig: isMajor ? (cur > hh ? "L" : (cur < ll ? "S" : null)) : null };
    } catch (e) {
      return { sym, err: String(e.message || e).slice(0, 40) };
    }
  }));

  // ---- 计算所有持仓的浮动盈亏，得到实时权益 ----
  FLOAT_PNL = 0;
  for (const r of rows) {
    if (r.err) continue;
    const pp = loadPos(r.sym);
    if (!pp || !pp.qty) continue;
    const sg = pp.dir === "L" ? 1 : -1;
    let u = pp.qty * (r.cur - pp.entry) * sg;
    const mg0 = pp.margin || (pp.qty * pp.entry / (pp.lev || 1));
    if ((pp.marginMode || "isolated") !== "cross" && mg0 > 0 && u < -mg0) u = -mg0;
    FLOAT_PNL += u;
  }
  // 仓位按「基准 + 浮动」算（复利）
  CFG.CAPITAL = Math.max(BASE_CAP + FLOAT_PNL, 0.01);
  _scannedOnce = true;

  // 取信号，按优先级
  const sigs = rows.filter(r => r.sig)
    .sort((a, b) => CFG.COINS.indexOf(a.sym) - CFG.COINS.indexOf(b.sym))
    .slice(0, CFG.MAX_POS);

  sigs.forEach(s => sizePosition(s));

  // 保证金总量检查：同时持仓不能超过本金
  let usedMargin = 0;
  const keep = [];
  const dropped = [];
  for (const s of sigs) {
    const m = s.notional / s.lev;
    if (usedMargin + m <= CFG.CAPITAL * 0.95 && !s.tooSmall) {
      usedMargin += m;
      s.margin = m;
      keep.push(s);
    } else {
      dropped.push(s);
    }
  }
  sigs.length = 0;
  sigs.push(...keep);
  rows._dropped = dropped;

  // 处理已有持仓：更新移动止损（所有持仓都要显示，不管有没有信号）
  const holdings = [];
  for (const r of rows) {
    if (r.err) continue;
    const p = loadPos(r.sym);
    if (!p) continue;
    r.pos = p;
    r.posInfo = updateTrailing(p, r);
    holdings.push(r);
  }
  rows._holdings = holdings;

  // 已持仓的币不再显示「开仓信号」，避免重复开仓
  const finalSigs = sigs.filter(s => !holdings.some(h => h.sym === s.sym));

  render(rows, finalSigs);
  btn.disabled = false;
  btn.textContent = "🔍 重新检查";
  $("hint").textContent = "点上面按钮可以重新检查";
  const srcSet = [...new Set(rows.filter(r => !r.err).map(r => r.src).filter(Boolean))];
  $("sub").textContent = "Donchian 20 · 日线 · " +
    new Date().toLocaleString("zh-CN", { hour12: false }) +
    (srcSet.length ? "  ·  数据：" + srcSet.join("/") : "");
}

/* ============ 仓位计算（币安整数杠杆 + 最小下单量）============ */
const STEP = { BTC: 0.001, ETH: 0.001, SOL: 0.01, BNB: 0.01, DOGE: 1, ADA: 1 };
const MIN_NOTIONAL = 5.1;    // 币安 U 本位最小下单额（实测 5.1）

function sizePosition(s) {
  s.stop = s.sig === "L" ? s.cur - CFG.K_SL * s.atr : s.cur + CFG.K_SL * s.atr;
  const dist = Math.abs(s.cur - s.stop) / s.cur;   // 止损距离（比例）
  s.dist = dist * 100;

  const cap = CFG.CAPITAL;
  const targetRisk = cap * CFG.RISK;               // 目标风险金额

  // 目标名义 = 风险金额 ÷ 止损距离（这才是真正的仓位）
  let notional = targetRisk / dist;
  const maxNotional = cap * CFG.MAX_LEV;
  if (notional > maxNotional) notional = maxNotional;   // 不超过杠杆上限

  // 整数杠杆：只需覆盖这个名义（杠杆是上限，不用满）
  let lev = Math.ceil(notional / cap);
  if (!isFinite(lev) || lev < 1) lev = 1;
  if (lev > CFG.MAX_LEV) lev = CFG.MAX_LEV;

  // 按币安最小变动单位向下取整
  const step = STEP[s.sym] || 0.001;
  const dec = String(step).split(".")[1] ? String(step).split(".")[1].length : 0;
  let qty = Math.floor((notional / s.cur) / step) * step;
  qty = +qty.toFixed(dec);

  notional = qty * s.cur;
  const actualRisk = notional * dist;

  s.lev = lev;
  s.qty = qty;
  s.notional = notional;
  s.risk = actualRisk;
  s.riskPct = (actualRisk / cap) * 100;            // 实际风险占本金
  s.tooSmall = notional < MIN_NOTIONAL;            // 低于最小下单额
  s.overRisk = s.riskPct > CFG.RISK * 100 + 0.5;   // 明显超过目标（取整导致）
}

function render(rows, sigs) {
  let h = "";

  const errs = rows.filter(r => r.err);
  if (errs.length) {
    h += '<div class="err">取数失败：' + errs.map(r => r.sym).join("、") +
         '<br><span style="font-size:12px;color:#8b6b6b">检查手机网络，或换个时间再试</span></div>';
  }
  if (rows._dropped && rows._dropped.length) {
    h += '<div class="warn">保证金不够，跳过：' +
         rows._dropped.map(s => s.sym).join("、") +
         '<br><span style="opacity:.75">同时开仓占用保证金不能超过本金</span></div>';
  }

  if (!sigs.length) {
    h += '<div class="empty"><b>今天没有信号</b>关掉就行，明天再看</div>';
  } else {
    sigs.forEach(s => {
      const rec = load(s.sym);
      const isDone = rec && rec.dir === s.sig;
      h += '<div class="card go' + (isDone ? " done" : "") + '">' +
        '<div class="top"><span class="sym">' + s.sym + '</span>' +
        '<span class="pill ' + s.sig + '">' + (s.sig === "L" ? "做多 ↗" : "做空 ↘") + '</span>' +
        (isDone ? '<span class="pill ok">已开仓</span>' : '<span class="pill x">立即开仓</span>') +
        '</div><div class="kv">' +
        '<div><span>入场</span><b>' + f(s.cur) + '</b></div>' +
        '<div><span>止损</span><b class="stop" onclick="copyOne(\'' + (s.stop >= 1000 ? s.stop.toFixed(1) : s.stop.toFixed(3)) + '\',this)">' + f(s.stop) + ' 📋</b></div>' +
        '<div><span>杠杆</span><b class="lev">' + s.lev + 'x 📋</b></div>' +
        '<div><span>数量</span><b onclick="copyOne(\'' + qtyStr(s) + '\',this)">' + qtyStr(s) + ' 📋</b></div>' +
        '<div><span>名义</span><b>' + s.notional.toFixed(1) + 'U</b></div>' +
        '<div><span>保证金</span><b>' + (s.margin || (s.notional / s.lev)).toFixed(1) + 'U</b></div>' +
        '<div><span>实际风险</span><b class="' + (s.overRisk ? "bad" : "good") + '">' + s.risk.toFixed(2) + 'U</b></div>' +
        '</div>' +
        (s.tooSmall ? '<div class="warn">⚠️ 仓位低于币安最小下单额 5U，这笔做不了</div>' : '') +
        (s.overRisk && !s.tooSmall ? '<div class="warn">⚠️ 止损太宽，1x 也要亏 ' + s.riskPct.toFixed(1) + '%（超过目标 5%）</div>' : '') +
        '<div class="acts">' +
        '<a class="p" onclick="copyOrder(\'' + s.sym + '\',\'' + s.sig + '\',' + s.lev + ',\'' + qtyStr(s) + '\',\'' + (s.stop >= 1000 ? s.stop.toFixed(1) : s.stop.toFixed(3)) + '\',this)">📋 复制下单参数</a>' +
        '<a onclick="mark(\'' + s.sym + '\',\'' + s.sig + '\')">' +
        (isDone ? '已记录 ✓' : '我已开仓') + '</a>' +
        '</div></div>';
    });
  }

  /* ---- 持仓中：移动止损 ---- */
  const holds = rows._holdings || [];
  if (holds.length) {
    h += '<h3>我的持仓</h3>';
    holds.forEach(r => {
      const p = r.pos, info = r.posInfo;
      const dirTxt = p.dir === "L" ? "多" : "空";
      const cls = p.dir === "L" ? "L" : "S";
      const pnlCls = info.pnlPct >= 0 ? "up" : "dn";
      const slTxt = info.moved
        ? '<b class="good">' + f(info.sl) + ' ⬆️</b>'
        : '<b>' + f(info.sl) + '</b>';
      // 盈亏金额（U）
      // 正确公式：数量 ×（现价 − 入场价）×方向
      const sign = p.dir === "L" ? 1 : -1;
      const mg = p.margin || (p.qty * p.entry / (p.lev || 1)) || 0;
      let pnlUsd = p.qty ? p.qty * (r.cur - p.entry) * sign : 0;
      const isCross = (p.marginMode || "isolated") === "cross";
      let liquidated = false;
      // 逐仓：最多亏光这笔保证金
      if (!isCross && mg > 0 && pnlUsd < -mg) { pnlUsd = -mg; liquidated = true; }
      const pnlMarginPct = mg > 0 ? (pnlUsd / mg) * 100 : 0;
      h += '<div class="card hold">' +
        '<div class="top"><span class="sym">' + r.sym + '</span>' +
        '<span class="pill ' + cls + '">' + dirTxt + '</span>' +
        '<span class="mmbadge ' + ((p.marginMode || 'isolated') === 'cross' ? 'cross' : 'iso') + '">' +
          ((p.marginMode || 'isolated') === 'cross' ? '全仓' : '逐仓') + '</span>' +
        (p.alt ? '' :
          (r.sig
            ? '<span class="pill ' + r.sig + '" style="font-size:11px">信号持续</span>'
            : '<span class="pill ok" style="font-size:11px">信号已失效</span>')) +
        '</div>' +
        // ↓ 唯一的盈亏显示块
        '<div class="pnlblock ' + pnlCls + '">' +
          '<div class="pnlbig">' + (pnlUsd >= 0 ? "+" : "") + pnlUsd.toFixed(2) + ' U</div>' +
          '<div class="pnlsmall">' + (pnlMarginPct >= 0 ? "+" : "") + pnlMarginPct.toFixed(2) +

          (liquidated ? '<div class="pnlboom">💀 已爆仓</div>' : '') +
        '</div><div class="kv">' +
        '<div><span>入场</span><b onclick="editPos(\'' + r.sym + '\')">' + f(p.entry) + ' ✏️</b></div>' +
        '<div><span>现价</span><b>' + f(r.cur) + '</b></div>' +
        (p.alt
          ? '<div><span>已持有</span><b>' + heldDays(p) + '</b></div>' +
            '<div><span>策略</span><b style="color:#4fe0a8">持20天不设止损</b></div>'
          : '<div><span>原止损</span><b>' + f(p.sl) + '</b></div>' +
            '<div><span>新止损</span>' + slTxt + '</div>') +
        '<div><span>保证金</span><b onclick="openMargin(\'' + r.sym + '\')">' +
          (p.margin ? p.margin.toFixed(2) + 'U' : '—') + ' ⚙️</b></div>' +
        '<div><span>名义</span><b>' + (p.qty * p.entry).toFixed(2) + 'U</b></div>' +
        '<div><span>价格变动</span><b>' + (info.pnlPct >= 0 ? "+" : "") + info.pnlPct.toFixed(2) + '%</b></div>' +
        '<div><span>杠杆</span><b>' + (p.margin && p.qty ? (p.qty * p.entry / p.margin).toFixed(2) + 'x' : '—') + '</b></div>' +
        '</div>' +
        (p.alt
          ? '<div style="font-size:11.5px;color:#5f6779;margin-top:8px">' +

            (function(){
              let extra = "";
              try {
                const d0 = new Date(p.date + "T00:00:00").getTime();
                const d = Math.floor((Date.now() - d0) / 86400000);
                const left = Math.max(0, 20 - d);
                extra = left > 0 ? "，还剩 " + left + " 天" : "，已到期可平";
              } catch (e) {}
              const lv = p.lev || 1;
              const boom = Math.round(100 / lv);
              return "山寨做空：不设止损" + extra + "。涨 " + boom + "% 爆仓，最多亏 " +
                (p.margin ? p.margin.toFixed(2) : '—') + "U";
            })() + '</div>'
          : (r.sig
            ? '<div style="font-size:11.5px;color:#5f6779;margin-top:8px">' +
              (r.sig === "L" ? "仍在 20 日高上方，多头信号有效" : "仍在 20 日低下方，空头信号有效") + '</div>'
            : '<div style="font-size:11.5px;color:#5f6779;margin-top:8px">已回到区间内，靠移动止损管理</div>')) +
        '<div class="acts">' +
        '<a onclick="openAdd(\'' + r.sym + '\')">➕ 加仓</a>' +
        '<a onclick="openMargin(\'' + r.sym + '\')">💰 保证金</a></div>' +
        '<div class="acts"><a class="closebtn" onclick="closePos(\'' + r.sym + '\')">✅ 我已平仓 / 删除记录</a></div>' +
        (info.shouldClose
          ? '<div class="warn" style="background:#1a0f11;border-color:#5c2028;color:#ff9aa6">🚪 ' +
            info.closeReason + ' → 现在平仓</div>' +
            '<div class="acts"><a class="p" style="background:#e8484f;color:#fff" onclick="closePos(\'' + r.sym + '\')">我已平仓</a></div>'
          : (info.moved
            ? '<div class="acts"><a class="p" onclick="applySl(\'' + r.sym + '\')">✅ 已在币安改好止损</a></div>'
            : (p.alt ? '' : '<div style="font-size:12px;color:#5f6779;margin-top:10px">止损未变，不用操作</div>'))) +
        '</div>';
      // 记录待更新的止损
      p._newSl = info.sl;
      p._newExt = info.ext;
    });
  }

  h += '<h3>主流币 · 按接近突破排序</h3>';
  // 计算每个币到最近突破位的距离，排序（已触发的排最前）
  const ranked = rows.map(r => {
    if (r.err) return { r, near: 999 };
    if (r.sig) return { r, near: -1 };
    const up = (r.hh / r.cur - 1) * 100;
    const dn = (1 - r.ll / r.cur) * 100;
    return { r, near: Math.min(up, dn), up, dn };
  }).sort((a, b) => a.near - b.near);

  const closest = ranked.find(x => x.near >= 0 && x.near < 900);

  ranked.forEach(({ r, up, dn }) => {
    if (r.err) {
      h += '<div class="w"><span class="n">' + r.sym + '</span>' +
           '<span class="u" style="grid-column:2/4;color:#e8484f">失败</span></div>';
      return;
    }
    if (r.sig) {
      h += '<div class="w"><span class="n">' + r.sym + '</span>' +
           '<span class="u" style="grid-column:2/4;color:#19c07a">已触发 ' +
           (r.sig === "L" ? "做多" : "做空") + ' ↗</span></div>';
      return;
    }
    if (!r.isMajor) {
      // 山寨币：只跟踪持仓，不给主系统信号
      const p2 = loadPos(r.sym);
      h += '<div class="w"><span class="n">' + r.sym +

let _editing = null;   // {sym, dir, atr, mode:'new'|'edit', stopTouched}

function mark(sym, dir) {
  const p = loadPos(sym);
  if (p) { alert(sym + " 已经记录过开仓了，可在持仓卡片里修改"); return; }
  const s = (window._last && window._last.sigs || []).find(x => x.sym === sym);
  if (!s) { alert("找不到这个信号，请重新检查"); return; }
  _editing = { sym, dir, atr: s.atr, mode: "new", stopTouched: false, sig: s };
  $("m-title").textContent = "记录开仓 " + sym + " " + (dir === "L" ? "做多" : "做空");
  $("m-entry").value = s.cur;
  $("m-stop").value = s.stop.toFixed(s.stop >= 1000 ? 1 : s.stop >= 1 ? 3 : 5);
  updateModalMsg();
  $("modal").classList.add("on");
}

function onEntryEdit() {
  if (!_editing || _editing.stopTouched) return;
  const e = parseFloat($("m-entry").value);
  if (!isFinite(e) || !_editing.atr) return;
  const stop = _editing.dir === "L" ? e - CFG.K_SL * _editing.atr : e + CFG.K_SL * _editing.atr;
  $("m-stop").value = stop.toFixed(stop >= 1000 ? 1 : stop >= 1 ? 3 : 5);
  updateModalMsg();
}

/* ============ 手动记录持仓 ============ */
let _npDir = "S";
let BASE_CAP = 97.66;        // 用户设定的基准余额（不含浮动盈亏）
let FLOAT_PNL = 0;           // 当前所有持仓的浮动盈亏
let _npCur = 0, _npCurSym = "";

async function npFetchPrice(sym) {
  sym = (sym || "").trim().toUpperCase();
  if (!sym || (_npCurSym === sym && _npCur > 0)) return;
  try {
    const bars = await daily(sym);
    if (bars && bars.length) {
      _npCur = bars[bars.length - 1].c;
      _npCurSym = sym;
      npCheck();
    }
  } catch (e) {}
}

function openNewPos() {
  _npDir = "S";
  $("np-sym").value = "";
  $("np-entry").value = "";
  $("np-margin").value = "";
  $("np-pnl").value = "";
  _npCur = 0; _npCurSym = "";
  $("np-msg").textContent = "";
  npDir("S");
  $("npmodal").classList.add("on");
}

function npDir(d) {
  _npDir = d;
  $("np-s").className = d === "S" ? "on short" : "";
  $("np-l").className = d === "L" ? "on long" : "";
  npCheck();
}

function npCalc() {
  const e = parseFloat($("np-entry").value);
  const m = parseFloat($("np-margin").value);
  const pnl = parseFloat($("np-pnl").value);
  const cur = _npCur;                      // 扫描拿到的现价
  if (!isFinite(e) || e <= 0) return null;
  // 用币安上的盈亏反推数量：qty = |盈亏| / |现价 - 开仓价|
  if (isFinite(pnl) && pnl !== 0 && cur > 0 && Math.abs(cur - e) > 1e-12) {
    return { qty: Math.abs(pnl) / Math.abs(cur - e), how: "按盈亏反推" };
  }
  // 没盈亏就用保证金（1x 假设）
  if (isFinite(m) && m > 0) {
    return { qty: m / e, how: "按保证金 1x 估算" };
  }
  return null;
}

function npCheck() {
  const sym = ($("np-sym").value || "").trim().toUpperCase();
  const e = parseFloat($("np-entry").value);
  const m = parseFloat($("np-margin").value);
  const pnl = parseFloat($("np-pnl").value);
  const msg = $("np-msg");
  msg.classList.remove("bad");
  if (!sym) { msg.textContent = "填入币种"; return; }
  if (sym !== _npCurSym) { _npCur = 0; npFetchPrice(sym); }
  if (loadPos(sym)) { msg.textContent = sym + " 已经有记录了，可在卡片里修改"; msg.classList.add("bad"); return; }
  if (!isFinite(e) || e <= 0) { msg.textContent = "填入开仓价格"; return; }
  if (!_npCur) { msg.textContent = "正在取现价…" + (sym ? "（先点确认让程序抓一次，或稍后重试）" : ""); }
  const r = npCalc();
  if (!r) { msg.textContent = "填入保证金 或 当前盈亏"; return; }
  const notional = r.qty * e;
  const lev = isFinite(m) && m > 0 ? notional / m : 1;
  msg.innerHTML = "数量 <b style='color:#8ab4ff'>" + r.qty.toFixed(6) + "</b>（" + r.how + "）<br>" +
    "名义 <b>" + notional.toFixed(2) + "U</b>　杠杆 <b>" + lev.toFixed(2) + "x</b>" +
    (isFinite(pnl) && pnl !== 0 ? "　现价 <b>" + _npCur + "</b>" : "");
}

function npClose() { $("npmodal").classList.remove("on"); }

function npSave() {
  const sym = ($("np-sym").value || "").trim().toUpperCase();
  const e = parseFloat($("np-entry").value);
  const m = parseFloat($("np-margin").value);
  if (!sym || !isFinite(e) || e <= 0) { alert("填写有误"); return; }
  const r = npCalc();
  if (!r) { alert("填入保证金或当前盈亏"); return; }
  const notional = r.qty * e;
  savePos(sym, {
    dir: _npDir, entry: e, sl: _npDir === "S" ? e * 2 : e * 0.5, ext: e,
    qty: r.qty, lev: isFinite(m) && m > 0 ? notional / m : 1,
    margin: isFinite(m) && m > 0 ? m : notional,
    marginMode: "isolated",
    date: new Date().toISOString().slice(0, 10), alt: true,
  });
  npClose();
  scanAll();
}

const SETTLE_KEY = "settlements";

function loadSettlements() {

}
function saveSettlements(list) {

}
function addSettlement(rec) {

  saveSettlements(list);
}

function openSettle() {

  } else {

    list.forEach((r, i) => {

      h += '<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #202633">' +
        '<span style="font-weight:700;color:#fff;min-width:70px">' + r.sym + '</span>' +

          (r.pnl >= 0 ? "#19c07a" : "#ff6b7d") + '">' + (r.pnl >= 0 ? "+" : "") + r.pnl.toFixed(2) + 'U</span>' +
        '<span style="font-size:11px;color:#4a5162">' + (r.date || "") + '</span>' +
        '<button onclick="delSettle(' + i + ')" style="padding:4px 10px;border-radius:8px;border:1px solid #3a2830;' +
          'background:#1a1216;color:#c98b96;font-size:12px;font-family:inherit">删</button>' +
        '</div>';
    });

    h += '<div style="font-size:12.5px;color:#7d8699;margin-bottom:12px">累计已结算：' +
      '<b style="color:' + (total >= 0 ? "#19c07a" : "#ff6b7d") + '">' +
      (total >= 0 ? "+" : "") + total.toFixed(2) + 'U</b></div>';

function delSettle(i) {
  const list = loadSettlements();
  if (i < 0 || i >= list.length) return;
  const r = list[i];
  if (!confirm("删除这条结算记录？\n\n" + r.sym + "  " + (r.pnl >= 0 ? "+" : "") + r.pnl.toFixed(2) + "U" +
               "\n\n删除后基准余额会反向调整 " + (-r.pnl).toFixed(2) + "U")) return;
  BASE_CAP -= r.pnl;
  try { localStorage.setItem("capital", String(BASE_CAP)); } catch (e) {}
  list.splice(i, 1);
  saveSettlements(list);
  CFG.CAPITAL = Math.max(BASE_CAP + FLOAT_PNL, 0.01);
  refreshCapBar();
  openSettle();      // 刷新列表
}

/* ============ 账户余额 ============ */
function loadCap() {
  try {
    const v = parseFloat(localStorage.getItem("capital"));
    if (isFinite(v) && v > 0) { CFG.CAPITAL = v; BASE_CAP = v; }
    const r = parseFloat(localStorage.getItem("riskpct"));
    if (isFinite(r) && r > 0 && r <= 0.5) CFG.RISK = r;
  } catch (e) {}
}

let _scannedOnce = false;

function refreshCapBar() {
  const el = $("cap-val"), h = $("cap-hint");
  if (!el) return;
  // 还没扫描过就不显示权益，避免闪出错误的中间值
  const hasPos = (function () {
    try { return Object.keys(localStorage).some(k => k.indexOf("pos_") === 0); } catch (e) { return false; }
  })();
  if (!_scannedOnce && hasPos) {
    el.textContent = "…";
    h.innerHTML = "正在获取持仓价格，稍候";
    return;
  }
  const eq = Math.max(BASE_CAP + FLOAT_PNL, 0.01);
  el.textContent = eq.toFixed(2) + " U";
  const raw = eq * CFG.RISK;
  const use = Math.max(raw, MIN_NOTIONAL);
  let extra = "";
  if (Math.abs(FLOAT_PNL) > 0.005) {
    extra = "<br>基准 " + BASE_CAP.toFixed(2) + "　浮动 <b style='color:" +
      (FLOAT_PNL >= 0 ? "#19c07a" : "#ff6b7d") + "'>" +
      (FLOAT_PNL >= 0 ? "+" : "") + FLOAT_PNL.toFixed(2) + "U</b>";
  }
  h.innerHTML = "单笔 " + (CFG.RISK * 100) + "% = " + raw.toFixed(2) + "U" +
    (use > raw + 0.001 ? " → 按下限 " + use.toFixed(2) + "U" : "") + extra;
}

function openCap() {
  $("c-usd").value = CFG.CAPITAL.toFixed(2);
  setRiskPct(CFG.RISK);
  onCapEdit();
  $("cmodal").classList.add("on");

let _tmpRisk = null;
function setRiskPct(r) {
  _tmpRisk = r;
  ["c-r3", "c-r5", "c-r8"].forEach(id => {
    const b = $(id);
    if (!b) return;
    b.classList.toggle("on", Math.abs(r - [0.03, 0.05, 0.08][["c-r3", "c-r5", "c-r8"].indexOf(id)]) < 1e-9);
  });
  onCapEdit();
}

function onCapEdit() {
  const v = parseFloat($("c-usd").value);

  const r = _tmpRisk || CFG.RISK;
  const raw = v * r;
  const use = Math.max(raw, MIN_NOTIONAL);
  msg.innerHTML = "单笔风险 <b>" + raw.toFixed(2) + "U</b>" +
    (use > raw + 0.001
      ? "　→　不足币安下限，实际用 <b style='color:#ffc94d'>" + use.toFixed(2) +
        "U</b>（" + (use / v * 100).toFixed(2) + "%）"
      : "") +
    "<br>最多同时 2 仓，总占用 <b>" + (use * 2).toFixed(2) + "U</b>";
  if (use > raw + 0.001) msg.classList.add("bad");
}

function cSave() {

  if (!_mmSym) return;
  const p = loadPos(_mmSym);
  const usd = parseFloat($("mm-usd").value);
  const msg = $("mm-msg");
  msg.classList.remove("bad");
  if (!isFinite(usd) || usd <= 0) { msg.textContent = "填入保证金金额"; return; }
  const notional = p.qty * p.entry;
  const lev = notional / usd;
  msg.innerHTML = "名义 <b>" + notional.toFixed(2) + "U</b>　→　杠杆 <b style='color:#8ab4ff'>" +
    lev.toFixed(2) + "x</b>";
  if (lev < 0.99) {
    msg.innerHTML += "<br><span style='color:#ff8fa0'>⚠️ 保证金比名义还大，说明记录的数量偏小，盈亏会算少</span>";
  }
  if (_mmMode === "cross") {
    msg.innerHTML += "<br><span style='color:#ff8fa0'>⚠️ 全仓模式下，价格暴涨会吃掉整个账户余额，" +
      "不再是「最多亏这笔」</span>";
    msg.classList.add("bad");
  } else {
    msg.innerHTML += "<br><span style='color:#4fe0a8'>逐仓：最多亏光这笔保证金</span>";
  }
}

function mmClose() { $("mmodal").classList.remove("on"); _mmSym = null; }

function mmSave() {
  if (!_mmSym) return;
  const usd = parseFloat($("mm-usd").value);
  if (!isFinite(usd) || usd <= 0) { alert("金额有误"); return; }
  const p = loadPos(_mmSym);
  p.margin = usd;
  p.marginMode = _mmMode;
  p.lev = p.qty * p.entry / usd;
  savePos(_mmSym, p);
  mmClose();
  if (window._last) render(window._last.rows, window._last.sigs);
}

/* ============ 加仓（分批建仓） ============ */
let _adding = null;

function openAdd(sym) {
  const p = loadPos(sym);
  if (!p) { alert("还没有这个币的持仓记录"); return; }
  const r = (window._last && window._last.rows || []).find(x => x.sym === sym);
  _adding = { sym, dir: p.dir };
  $("a-title").textContent = "加仓 " + sym + " " + (p.dir === "L" ? "做多" : "做空");
  $("a-price").value = r ? r.cur : p.entry;
  $("a-usd").value = "45";
  onAddEdit();
  $("amodal").classList.add("on");
}

function onAddEdit() {
  if (!_adding) return;
  const pr = parseFloat($("a-price").value);
  const usd = parseFloat($("a-usd").value);
  const msg = $("a-msg");
  msg.classList.remove("bad");
  if (!isFinite(pr) || !isFinite(usd) || pr <= 0 || usd <= 0) {
    msg.textContent = "填入价格和金额";
    return;
  }
  const p = loadPos(_adding.sym);
  const addQty = usd / pr;
  const oldQty = p.qty || 0;
  const newQty = oldQty + addQty;
  const oldMargin = p.margin || (oldQty * p.entry / (p.lev || 1));
  const newMargin = oldMargin + usd;
  const newEntry = (oldQty * p.entry + addQty * pr) / newQty;
  const newLev = (newQty * newEntry) / newMargin;
  msg.innerHTML = "加仓数量 <b style='color:#8ab4ff'>" + addQty.toFixed(6) + "</b><br>" +
    "均价 <b>" + fmtP(oldEntry(p)) + " → " + fmtP(newEntry) + "</b>　" +
    "总量 <b>" + newQty.toFixed(6) + "</b><br>" +
    "保证金 <b>" + oldMargin.toFixed(2) + " → " + newMargin.toFixed(2) + " U</b>　" +
    "杠杆 <b>" + newLev.toFixed(2) + "x</b>";
}

function oldEntry(p) { return p.entry; }

function fmtP(v) {
  if (v >= 1000) return v.toFixed(1);
  if (v >= 10) return v.toFixed(2);
  if (v >= 1) return v.toFixed(3);
  return v.toFixed(5);
}

function aClose() { $("amodal").classList.remove("on"); _adding = null; }

function aSave() {
  if (!_adding) return;
  const pr = parseFloat($("a-price").value);
  const usd = parseFloat($("a-usd").value);
  if (!isFinite(pr) || !isFinite(usd) || pr <= 0 || usd <= 0) { alert("填写有误"); return; }
  const p = loadPos(_adding.sym);
  if (!p) return;
  const addQty = usd / pr;
  const oldQty = p.qty || 0;
  const newQty = oldQty + addQty;
  const oldMargin = p.margin || (oldQty * p.entry / (p.lev || 1));
  const newMargin = oldMargin + usd;
  const newEntry = (oldQty * p.entry + addQty * pr) / newQty;
  p.legs = p.legs || [{ entry: p.entry, qty: oldQty, margin: oldMargin, date: p.date }];
  p.legs.push({ entry: pr, qty: addQty, margin: usd, date: new Date().toISOString().slice(0, 10) });
  p.entry = newEntry;
  p.qty = newQty;
  p.margin = newMargin;
  p.lev = newQty * newEntry / newMargin;
  savePos(_adding.sym, p);
  aClose();
  if (window._last) render(window._last.rows, window._last.sigs);
}

/* 修改已有持仓的入场价 */
function editPos(sym) {
  const p = loadPos(sym);
  if (!p) return;
  const r = (window._last && window._last.rows || []).find(x => x.sym === sym);
  _editing = { sym, dir: p.dir, atr: (r && r.atr) || 0, mode: "edit", stopTouched: true };
  $("m-title").textContent = "修改 " + sym + " 入场价";
  $("m-entry").value = p.entry;
  $("m-stop").value = p.sl;
  updateModalMsg();
  $("modal").classList.add("on");
}

function onStopEdit() {
  if (_editing) _editing.stopTouched = true;
  updateModalMsg();
}

function updateModalMsg() {
  if (!_editing) return;
  const e = parseFloat($("m-entry").value);
  const s = parseFloat($("m-stop").value);
  const msg = $("m-msg");
  msg.classList.remove("bad");
  if (!isFinite(e) || !isFinite(s)) { msg.textContent = "填入数字"; return; }
  const dist = Math.abs(e - s) / e;
  if (dist <= 0) { msg.textContent = "止损不能等于入场价"; msg.classList.add("bad"); return; }
  const riskUsd = CFG.CAPITAL * CFG.RISK;
  const qty = riskUsd / (Math.abs(e - s));
  const valid = _editing.dir === "L" ? s < e : s > e;
  msg.innerHTML = "止损距离 <b style='color:#ffc94d'>" + (dist * 100).toFixed(2) + "%</b>　" +
    "按此价位，数量应为 <b style='color:#8ab4ff'>" + qty.toFixed(6) + "</b>";
  if (!valid) {
    msg.innerHTML += "<br><span style='color:#ff8fa0'>⚠️ 方向不对：做多时止损要低于入场价，做空要高于</span>";
    msg.classList.add("bad");
  }
}

function modalClose() {
  $("modal").classList.remove("on");
  _editing = null;
}

function modalSave() {
  if (!_editing) return;
  const e = parseFloat($("m-entry").value);
  const s = parseFloat($("m-stop").value);
  if (!isFinite(e) || !isFinite(s) || e <= 0) { alert("价格填写有误"); return; }
  const valid = _editing.dir === "L" ? s < e : s > e;
  if (!valid) { alert("止损方向和持仓方向不一致"); return; }

  const old = loadPos(_editing.sym);
  savePos(_editing.sym, {
    dir: _editing.dir,
    entry: e,
    sl: s,
    ext: _editing.mode === "edit" && old ? (old.ext || e) : e,
    qty: old ? old.qty : +(CFG.CAPITAL * CFG.RISK / Math.abs(e - s)).toFixed(6),
    lev: old ? old.lev : 1,
    margin: old ? (old.margin || old.qty * old.entry / (old.lev || 1)) : (CFG.CAPITAL * CFG.RISK),
    marginMode: old ? (old.marginMode || "isolated") : "isolated",
    date: old ? old.date : new Date().toISOString().slice(0, 10),
    edited: _editing.mode === "edit" ? true : undefined,
  });
  modalClose();
  if (window._last) render(window._last.rows, window._last.sigs);
}

/* 山寨币做空：直接记录持仓 */
function markAlt(sym, price, usd, qty, el) {
  if (loadPos(sym)) { alert(sym + " 已经有持仓记录了"); return; }
  if (!confirm("确认已在币安开好 " + sym + " 的空单？\n\n仓位 " + usd.toFixed(2) + "U\n数量 " + qty)) return;
  savePos(sym, {
    dir: "S", entry: price, sl: price * 2, ext: price,
    qty: parseFloat(qty), lev: 1, margin: usd, marginMode: "isolated",
    date: new Date().toISOString().slice(0, 10),
    alt: true,
  });
  if (window._last) render(window._last.rows, window._last.sigs);
  scanAll();
}

/* 复制做空参数 */
function copyShort(sym, price, usd, qty, el) {
  const txt = sym + " 做空\n现价 " + price + "\n仓位 " + usd.toFixed(2) + "U（1x）\n数量 " + qty +
              "\n不设止损，持有 20 天";
  const done = () => {
    if (el) { const o = el.textContent; el.textContent = "✅ 已复制"; setTimeout(() => el.textContent = o, 1600); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
}

/* 复制下单参数（不用跳转币安网站，直接粘到 App 里） */
function qtyStr(s) {
  const step = STEP[s.sym] || 0.001;
  const dec = String(step).split(".")[1] ? String(step).split(".")[1].length : 0;
  return s.qty.toFixed(dec);
}

function copyOrder(sym, dir, lev, qty, stop, el) {
  const txt = sym + "USDT " + (dir === "L" ? "做多" : "做空") +
              "\n杠杆 " + lev + "x" +
              "\n数量 " + qty +
              "\n止损 " + stop;
  const done = () => {
    if (el) { const o = el.textContent; el.textContent = "✅ 已复制"; setTimeout(() => el.textContent = o, 1600); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else {
    fallbackCopy(txt, done);
  }
}

function fallbackCopy(txt, cb) {
  const ta = document.createElement("textarea");
  ta.value = txt;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); if (cb) cb(); }
  catch (e) { alert("请手动复制：\n\n" + txt); }
  document.body.removeChild(ta);
}

/* 点单个数值也能复制 */
function copyOne(v, el) {
  const txt = String(v);
  const done = () => { if (el) { const o = el.textContent; el.textContent = "已复制"; setTimeout(() => el.textContent = o, 900); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else { fallbackCopy(txt, done); }
}

/* ============ 风险档位切换 ============ */
function renderRiskBar() {
  const bar = $("riskbar");
  if (!bar) return;
  bar.innerHTML = RISK_LEVELS.map(r =>
    '<button class="' + (Math.abs(CFG.RISK - r.key) < 1e-9 ? "on" : "") +
    '" onclick="setRisk(' + r.key + ')">' + r.name +
    '<small>' + (r.key * 100) + '%</small></button>'
  ).join("");
}

function setRisk(v) {
  CFG.RISK = v;
  try { localStorage.setItem("risk", String(v)); } catch (e) {}
  renderRiskBar();
  if (window._last) {
    window._last.sigs.forEach(s => sizePosition(s));
    render(window._last.rows, window._last.sigs);
  }
  $("hint").textContent = "已切换到 " + (v * 100) + "% 风险";
}

loadCap();
refreshCapBar();
if (needOnboard()) setTimeout(openWelcome, 400);
setTimeout(refreshCapBar, 500);

/* 恢复上次选择的风险档 */
try {
  const saved = parseFloat(localStorage.getItem("risk"));
  if (saved && saved > 0 && saved <= 0.5) CFG.RISK = saved;
} catch (e) {}
renderRiskBar();

/* 页面加载：有 3 分钟内缓存就显示缓存，否则自动检查 */
(function () {
  let shown = false;
  try {
    const c = localStorage.getItem("last_result");
    if (c) {
      const d = JSON.parse(c);
      if (Date.now() - d.t < 180000) {
        render(d.rows, d.sigs);
        $("hint").textContent = "显示几分钟前的结果，点上面可刷新";
        $("go").textContent = "🔍 重新检查";
        shown = true;
      }
    }
  } catch (e) {}
  if (!shown) setTimeout(scanAll, 200);
})();

/* 保存结果供 mark() 重渲染 */
const _origRender = render;
window.render = function (rows, sigs) {
  window._last = { rows, sigs };
  try { localStorage.setItem("last_result", JSON.stringify({ rows, sigs, t: Date.now() })); } catch (e) {}
  _origRender(rows, sigs);
};
</script>
