<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>信号</title>
<style>
html,body{height:100%;margin:0;background:#0a0c10;color:#8b93a7;
font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.dot{width:10px;height:10px;border-radius:50%;background:#19c07a;animation:p 1.1s infinite ease-in-out}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
a{color:#2f6bff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot"></div>
  <div>正在连接信号服务…</div>
  <div style="font-size:12.5px;color:#4a5162">如果一直停在这里，检查手机网络</div>
  <a id="go" href="https://u2pii.github.io/signal/">手动打开</a>
</div>
<script>
setTimeout(function () { location.replace("https://u2pii.github.io/signal/"); }, 1200);
</script>
</body>
</html>
