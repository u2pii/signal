<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="robots" content="noindex,nofollow">
<title>口令</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:#0a0c10;color:#d2d8e6;font:16px/1.6 -apple-system,"PingFang SC",sans-serif;
padding:40px 18px;max-width:430px;min-height:100vh}
h1{font-size:19px;color:#fff;margin:0 0 6px}
.sub{font-size:12px;color:#5f6779;margin-bottom:26px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #2a3448;background:#12151d;
color:#fff;font-size:17px;font-family:inherit}
input:focus{outline:none;border-color:#2f6bff}
button{width:100%;padding:16px;border:0;border-radius:13px;font-size:16px;font-weight:700;
color:#fff;background:linear-gradient(135deg,#2f6bff,#1f4fd0);margin-top:12px;font-family:inherit}
button:active{transform:scale(.98)}
.err{color:#ff8fa0;font-size:13px;margin-top:10px;min-height:20px}
.card{background:#12151d;border:1px solid #202633;border-radius:14px;padding:20px;margin-top:18px;text-align:center}
.tok{font-size:34px;font-weight:800;letter-spacing:5px;color:#19c07a;font-family:ui-monospace,monospace;
word-break:break-all;line-height:1.3}
.tdate{font-size:12px;color:#5f6779;margin-top:8px}
.copy{margin-top:14px;padding:12px;border-radius:11px;background:#0f2e22;color:#4fe0a8;
font-size:14px;font-weight:600;border:1px solid #1e3a28;text-align:center;cursor:pointer}
.hint{font-size:11.5px;color:#3d4352;line-height:1.9;margin-top:26px}
</style>
</head>
<body>
<h1>今日口令</h1>
<div class="sub">只有你自己能看这个页面 — 输主密码生成</div>

<div id="gate">
  <input id="pw" type="password" placeholder="主密码" autocomplete="current-password">
  <button onclick="unlock()">生成今日口令</button>
  <div class="err" id="err"></div>
</div>

<div id="out" style="display:none">
  <div class="card">
    <div class="tok" id="tok">--------</div>
    <div class="tdate" id="tdate"></div>
    <div class="copy" onclick="copyTok()">📋 复制口令</div>
  </div>
  <div class="hint">
    口令每天 0 点（北京时间）自动更换，昨天生成的仍可用 1 天。<br>
    把口令发给朋友，他们输入后才能用。<br>
    关掉页面重新打开需要重新输主密码。
  </div>
</div>

<div class="hint">这个页面不会被搜索引擎收录，也没有任何链接指向它。<br>建议直接收藏，别把网址发给别人。</div>

<script>
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const ROUNDS = 20000;
let TOKEN = "";

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const d = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function makeToken(pw, dateStr) {
  let x = await sha256(pw + ":" + dateStr);
  for (let i = 0; i < ROUNDS; i++) {
    x = await sha256(x + pw);
  }
  let t = "";
  for (let i = 0; i < 10; i++) {
    t += ALPHABET[parseInt(x.substr(i * 2, 2), 16) % 32];
  }
  return t;
}

function bjDate(offsetDays) {
  const ms = Date.now() + 8 * 3600e3 + (offsetDays || 0) * 86400e3;
  return new Date(ms).toISOString().slice(0, 10);
}

async function unlock() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  if (!pw) { err.textContent = "请输入主密码"; return; }
  if (!crypto.subtle) { err.textContent = "需要 https 环境才能运行"; return; }
  err.textContent = "计算中…（约 2 秒）";
  try {
    const today = bjDate(0);
    TOKEN = await makeToken(pw, today);
    document.getElementById("tok").textContent = TOKEN;
    document.getElementById("tdate").textContent = "有效期 " + today + "（含昨天）";
    document.getElementById("gate").style.display = "none";
    document.getElementById("out").style.display = "";
  } catch (e) {
    err.textContent = "出错：" + e.message;
  }
}

function copyTok() {
  if (!TOKEN) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(TOKEN).then(() => alert("已复制：" + TOKEN))
      .catch(() => prompt("手动复制", TOKEN));
  } else {
    prompt("手动复制", TOKEN);
  }
}
</script>
</body>
</html>
